[project]
name = "qca-lite-qutip-twin"
version = "0.1.0"
description = "Small QuTiP digital-twin backend plugin for NVIDIA QCA"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "numpy>=2.2,<3",
    "qutip>=5.2,<6",
    "requests>=2.32,<3",
    "scipy>=1.15,<2",
    "werkzeug>=3.1,<4",
]

[project.optional-dependencies]
cuda = [
    "cuquantum-python-cu13>=26.1,<27",
    "qutip-cuquantum>=0.3,<0.4",
]
test = [
    "pytest>=9,<10",
]

[project.scripts]
qca-lite-twin = "qca_lite_twin.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: requires a working QuTiP cuQuantum data layer",
]
